# `west build -S debug ...` : make the image easy to debug with gdb/OpenOCD.
# -O0-ish code so variables are not optimised away and stepping follows source.
CONFIG_DEBUG_OPTIMIZATIONS=y
# Export the kernel's thread list offsets (_kernel_thread_info_*) for debugger
# thread awareness. NOTE: OpenOCD's `-rtos Zephyr` is not supported on riscv, so
# `info threads` will NOT list Zephyr threads there; the offsets are still
# usable by a gdb script / other tools. Needs !SMP (penguin is 1 hart).
CONFIG_DEBUG_THREAD_INFO=y
# Frame pointers: reliable backtraces in gdb and in the fatal-error dump.
CONFIG_FRAME_POINTER=y
CONFIG_EXCEPTION_STACK_TRACE=y
# Fail early on kernel API misuse.
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
