# Tests expected to fail on the current (stock) Zephyr fork.
# scripts/run_tests.py reports these as XFAIL (run still succeeds) and flags
# XPASS when one starts passing: then delete the entry.
# id = scenario name from testcase.yaml.
# ctx_switch_min is the reproducer we keep for the RVV context-switch bug.
known_failures:
  - id: arch.riscv.rvv.ctx_switch_min
    reason: >-
      Kernel bug (same bug the removed, larger ctx_switch test showed): a thread preempted by
      an IRQ is saved twice and resumes with vl/vtype = e8,m8,VLMAX. On the
      stock fork 2 of 3 cases fail in every run: test_preempt_csr reads
      vl=0x100 vtype=0xc3, test_preempt_compiled faults with an illegal
      instruction (mcause 2); test_voluntary_csr passes. Hardware to confirm.
    fixed_by: zephyr-penguin patches/zephyr/0005-riscv-v-make-vstate-save-idempotent.patch (not applied)
