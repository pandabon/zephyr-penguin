# West manifest for the Chipyard Zephyr (zephyr-penguin) workspace (first SoC: penguin).
#
#   cd bringup && west init -l zephyr-penguin && west update
#
# Zephyr itself is only pulled in for the arch/riscv RVV context-switch and
# POSIX patches that cannot live in a module; everything SoC/board specific
# lives in this repo.
manifest:
  remotes:
    - name: ucb-bar
      url-base: https://github.com/ucb-bar

  projects:
    - name: zephyr
      remote: ucb-bar
      # Tip of the 'penguinsoc' commits (RVV save/restore, HTIF flush, POSIX
      # affinity). Already on ucb-bar/zephyr origin branches (e.g.
      # saturn-fork-wip), so pinning the SHA needs no push.
      revision: 852bb170cc5655577e9cb3a673e69e2e0c3b00c5
      # Zephyr's own west commands (west build, flash, debug, twister, ...) are
      # declared in the fork's scripts/west-commands.yml; naming it here is all
      # we need from the fork's manifest. Nothing else is fetched: the C library
      # is the Zephyr SDK's prebuilt picolibc (CONFIG_PICOLIBC_USE_TOOLCHAIN),
      # so the picolibc source module is not needed, and muriscv-nn is not used
      # (both dropped 2026-10-11). If a workload needs a dependency from the
      # fork's west-riscv.yml (eigen_headers, xnnpack, executorch), add an
      # `import: {file: west-riscv.yml, name-allowlist: [<name>]}` here and run
      # `west update`.
      west-commands: scripts/west-commands.yml

  self:
    path: zephyr-penguin
